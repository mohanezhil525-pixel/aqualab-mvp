version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: water_lab_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: water_lab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - water_lab_net

  redis:
    image: redis:7-alpine
    container_name: water_lab_redis
    ports:
      - "6379:6379"
    networks:
      - water_lab_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: water_lab_backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/water_lab_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkey_for_development
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - water_lab_net
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: water_lab_frontend
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - water_lab_net
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  water_lab_net:
    driver: bridge
